services:
  db:
    image: postgres:16-alpine
    container_name: eventpulse_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # ports:
      # - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: eventpulse_api
    shm_size: "2gb"
    restart: always
    # Порты наружу больше не пробрасываем, FastAPI скрыт внутри сети Docker
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - .:/app
    command: uvicorn Event_Pulse_app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  gateway:
    image: nginx:1.25-alpine
    container_name: eventpulse_nginx
    restart: always
    ports:
      # Пробрасываем стандартный веб-порт на Windows
      - "80:80"
    volumes:
      # Монтируем наш конфигурационный файл внутрь Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web


  adminer:
    image: adminer:latest
    container_name: eventpulse_adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db


volumes:
  postgres_data:
